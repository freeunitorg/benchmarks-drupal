# Main configuration for the webservers built from upstream tarballs.  The
# directives match what the Debian nginx package sets for the published
# nginx-fpm runtime (worker_processes auto, sendfile/tcp_nopush on,
# keepalive_timeout 65), so a difference between these runtimes is the server
# source and not the tuning.  error_log goes to stderr so the harness alert scan
# sees it; the Debian package logs to a file instead and is only compared with
# its own family.
worker_processes auto;
error_log /dev/stderr warn;
pid /run/ws.pid;

events {
    worker_connections 1024;
}

http {
    include conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    access_log off;
    gzip off;
