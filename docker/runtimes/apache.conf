# Drupal on Apache prefork + mod_php. Child counts from the plan section 4.3.
<IfModule mpm_prefork_module>
    StartServers             20
    MinSpareServers          20
    MaxSpareServers          20
    ServerLimit              20
    MaxRequestWorkers        20
    MaxConnectionsPerChild   10000
</IfModule>
KeepAlive On
MaxKeepAliveRequests 10000
KeepAliveTimeout 60
ServerTokens Prod
ServerSignature Off
LogLevel warn
# No CustomLog: the access log is off in the measured window.
<Directory /app/web>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
DocumentRoot /app/web
