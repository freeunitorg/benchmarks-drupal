name: pages

# Renders public/ from committed results/*/summary.json and publishes every page
# it to gh-pages. No benchmark runs here: shared runners cannot pin cores or read
# hardware counters (plan section 7).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# collect-commit.sh makes one push per collected run, so several of these runs
# start together and each one force-pushes gh-pages.  Without a group the losers
# die with "cannot lock ref 'refs/heads/gh-pages'": the deploy that finishes last
# is the correct one (it renders every result in the repository), so queue them and
# keep the newest rather than letting the pushes race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and render
        run: python3 report/render.py results public/index.html
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
